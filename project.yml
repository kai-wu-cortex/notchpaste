name: NotchPaste
options:
  bundleIdPrefix: com.notchpaste
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "6.0.0"

targets:
  NotchPaste:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: NotchPaste
        excludes:
          - "**/*.md"
    info:
      path: NotchPaste/App/Info.plist
      properties:
        CFBundleName: NotchPaste
        CFBundleDisplayName: NotchPaste
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: zh-Hans
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "Copyright © 2026 NotchPaste. MIT Licensed."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notchpaste.app
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"
    dependencies:
      - package: GRDB

  NotchPasteTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: NotchPasteTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notchpaste.app.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: NotchPaste
      - package: GRDB
